name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: jucalast
          BRANCH_NAME: main
          THEME: github_dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
